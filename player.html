<!doctype html>
<html lang="ja">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
*{box-sizing:border-box}
body{margin:0;font:15px/1.5 "Yu Gothic UI",system-ui,sans-serif;color:#172d3b}
main{display:grid;grid-template-columns:minmax(0,3fr) minmax(240px,2fr);gap:16px}
video{display:block;width:100%;height:350px;background:#101f31;border-radius:10px}
section{height:350px;overflow:auto;background:#f7faf9;border:1px solid #ccd9d5;border-radius:10px}
button{display:flex;align-items:baseline;gap:16px;width:100%;text-align:left;padding:11px 14px;background:transparent;color:inherit;border:0;border-bottom:1px solid #dce5e2;cursor:pointer;font:inherit}
button:hover,button[aria-current=true]{background:#d9f2ea}
button:focus-visible{outline:2px solid #147257;outline-offset:-2px}
time{color:#126651;font:600 14px/1.4 Consolas,monospace}
span{overflow-wrap:anywhere}
p{margin:12px}
#status{font-size:14px;color:#963b13}
@media(max-width:660px){main{grid-template-columns:1fr;gap:8px}video{height:196px}section{height:153px}}
</style>
<main><video controls playsinline preload="auto" aria-label="録画プレーヤー" src="data:video/mp4;base64,$video"></video>
<section aria-label="コメントタイムライン">$comments</section></main>
<div id="status" role="status"></div>
<script>
const player = document.querySelector('video');
const timeline = document.querySelector('section');
const status = document.getElementById('status');
player.addEventListener('error', () => {
  status.textContent = '動画を再生できません。H.264 形式の MP4 をお試しください。';
});
timeline.addEventListener('click', async event => {
  const row = event.target.closest('button');
  if (!row) return;
  timeline.querySelector('[aria-current]')?.removeAttribute('aria-current');
  row.setAttribute('aria-current', 'true');
  try {
    player.currentTime = Number(row.dataset.start);
    await player.play();
    status.textContent = '';
  } catch {
    status.textContent = '再生ボタンを押してください。再生できない場合は H.264 形式を確認してください。';
  }
});
</script>
</html>
